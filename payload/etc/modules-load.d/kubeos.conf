# KubeOS: the two modules Kubernetes needs before anything else starts.
#
# WHY    overlay backs containerd's overlayfs snapshotter, and br_netfilter is what makes
#        iptables rules apply to bridged pod traffic (kube-proxy and the CNI need both).
#        Shipping this as its own drop-in rather than as /etc/modules-load.d/modules.conf is
#        deliberate: that file belongs to the systemd package, and a package that overwrites
#        it makes dpkg refuse to install ("trying to overwrite ... which is also in package
#        systemd").
overlay
br_netfilter
